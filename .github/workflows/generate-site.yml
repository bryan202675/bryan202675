name: Generate five-hour website

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: five-hour-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run generator
        run: python scripts/generate_scheduled_site.py
      - name: Run tests
        run: python -B -m unittest discover -s tests -v
      - name: Commit due editions
        run: |
          if git diff --quiet && test -z "$(git status --porcelain)"; then
            echo "No five-hour slot is due"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webs
          git commit -m "feat: generate scheduled website"
          git push
