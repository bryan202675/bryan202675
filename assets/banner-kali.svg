  <text x="1065" y="153" text-anchor="middle" fill="#FFF" fill-opacity=".65" font-size="10">CLAUDE</text>
  <text x="675" y="450" class="muted" font-size="11">KALI NODE / ACTIVE</text>
  <text x="1126" y="450" text-anchor="end" fill="#38BDF8" font-size="11">LOOP ∞</text>
</svg>
