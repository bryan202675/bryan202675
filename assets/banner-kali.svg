<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Bryan - React, Kali Linux y ciberseguridad</title>
  <desc id="desc">Banner animado estilo terminal con ventanas de macOS, el logo de Kali Linux en movimiento y Claude como elemento secundario.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030407"/>
      <stop offset="0.5" stop-color="#090B12"/>
      <stop offset="1" stop-color="#05060A"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".18"/>
      <stop offset=".48" stop-color="#8B5CF6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38BDF8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wide-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FFF" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="stage-clip"><rect x="650" y="72" width="500" height="394" rx="18"/></clipPath>
    <style>
      text{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}
      .muted{fill:#A7ADBB}.white{fill:#FFF}.accent{fill:#38BDF8}
      .blink{animation:blink 1s steps(1,end) infinite}
      .float{animation:float 4.8s ease-in-out infinite}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .dash{animation:dash 10s linear infinite}
      .glitch{animation:glitch 7s steps(1,end) infinite}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.12}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes pulse{0%,100%{opacity:.38}50%{opacity:.9}}
      @keyframes dash{to{stroke-dashoffset:-180}}
      @keyframes glitch{0%,92%,100%{opacity:1;transform:translate(0)}93%{opacity:.45;transform:translate(4px,-2px)}94%{opacity:1;transform:translate(-3px,1px)}95%{transform:translate(0)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="1200" height="520" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="25" fill="none" stroke="#FFF" stroke-opacity=".13" stroke-width="2"/>
  <rect x="18" y="18" width="1164" height="484" rx="20" fill="url(#grid)"/>
  <ellipse cx="835" cy="267" rx="350" ry="285" fill="url(#halo)"/>

  <rect x="42" y="42" width="1116" height="436" rx="20" fill="#090B10" fill-opacity=".82" stroke="#FFF" stroke-opacity=".14"/>
  <path d="M42 93H1158" stroke="#FFF" stroke-opacity=".11"/>
  <circle cx="72" cy="67" r="7" fill="#FF5F57"/><circle cx="96" cy="67" r="7" fill="#FEBC2E"/><circle cx="120" cy="67" r="7" fill="#28C840"/>
  <text x="600" y="72" text-anchor="middle" class="muted" font-size="14">bryan@kali — profile.sh — 120×32</text>
  <text x="1118" y="72" text-anchor="end" fill="#FFF" fill-opacity=".38" font-size="12">SECURE SESSION</text>

  <g transform="translate(78 128)">
    <text class="accent" font-size="15" font-weight="700">┌──(bryan㉿kali)-[~/profile]</text>
    <text y="32" class="white" font-size="16">└─$ ./whoami --verbose <tspan class="blink" fill="#38BDF8">▌</tspan></text>
    <g class="glitch">
      <text y="84" class="white" font-size="39" font-weight="800" letter-spacing="1">BRYAN</text>
      <text y="116" class="muted" font-size="16">React-first developer · Security mindset</text>
    </g>
    <path d="M0 144H500" stroke="#FFF" stroke-opacity=".12"/>
    <text y="180" class="muted" font-size="14">focus</text>
    <text x="95" y="180" class="white" font-size="14">React · TypeScript · Product Engineering</text>
    <text y="212" class="muted" font-size="14">security</text>
    <text x="95" y="212" class="white" font-size="14">Kali Linux · Labs · Defensive thinking</text>
    <text y="244" class="muted" font-size="14">build</text>
    <text x="95" y="244" class="white" font-size="14">Web · Mobile · Automation · AI</text>
    <text y="276" class="muted" font-size="14">status</text>
    <text x="95" y="276" fill="#38BDF8" font-size="14">learning / shipping / improving</text>
    <rect y="311" width="500" height="45" rx="10" fill="#FFF" fill-opacity=".045" stroke="#FFF" stroke-opacity=".1"/>
    <circle cx="20" cy="334" r="4" fill="#28C840" class="pulse"/>
    <text x="36" y="339" class="white" font-size="13">runtime: production-minded · curiosity: always-on</text>
  </g>

