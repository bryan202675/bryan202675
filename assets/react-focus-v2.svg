<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">React at the center of Bryan's work</title>
  <desc id="desc">Monochrome animation connecting React with product development, components, data, verification, and deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop stop-color="#08090C"/>
      <stop offset="1" stop-color="#0F1117"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .w { fill: #FFFFFF; }
      .m { fill: #8B949E; }
      .sub { fill: #C9D1D9; }
      .orbit { animation: spin 14s linear infinite; transform-origin: 190px 175px; }
      .dash { animation: dash 2s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .dash { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="350" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="348" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity=".12"/>

  <!-- React Atom (Monochrome White) -->
  <g>
    <!-- Ambient back light -->
    <circle cx="190" cy="175" r="116" fill="#FFFFFF" fill-opacity=".025"/>
    
    <!-- Rotating Orbits in Pure White -->
    <g class="orbit" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity=".9" filter="url(#glow)">
      <ellipse cx="190" cy="175" rx="92" ry="35"/>
      <ellipse cx="190" cy="175" rx="92" ry="35" transform="rotate(60 190 175)"/>
      <ellipse cx="190" cy="175" rx="92" ry="35" transform="rotate(120 190 175)"/>
    </g>

    <!-- Expanding pulse ring from nucleus -->
    <circle cx="190" cy="175" r="14" fill="none" stroke="#FFFFFF" filter="url(#glow)">
      <animate attributeName="r" values="14;34" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Nucleus Center Dot -->
    <circle cx="190" cy="175" r="14" fill="#FFFFFF" filter="url(#glow)">
      <animate attributeName="r" values="12;15;12" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Typography Header -->
  <text x="350" y="92" class="m" font-size="12" letter-spacing="2">PRIMARY FRONTEND SYSTEM</text>
  <text x="350" y="145" class="w" font-size="34" font-weight="800">React turns ideas into products.</text>
  <text x="350" y="183" class="sub" font-size="15">Reusable UI · real data · thoughtful interaction · verified delivery</text>

  <!-- Separator Line -->
  <path d="M350 224H1120" stroke="#FFFFFF" stroke-opacity=".1"/>

  <!-- Flow Track Line (Animated Dashes) -->
  <path d="M390 266H1080" fill="none" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="2" stroke-dasharray="6 10" class="dash"/>

  <!-- Pipeline Nodes (Sequential Pulse in Sync with the Beam) -->
  <g font-size="11" text-anchor="middle">
    <!-- Node 1: IDEA (Beam arrives at t=0 / t=3.6s) -->
    <g transform="translate(390 266)">
      <circle r="19" fill="#0D1117" stroke="#FFFFFF" stroke-opacity=".35"/>
      <!-- Flash Ripple -->
      <circle r="19" fill="none" stroke="#FFFFFF" opacity="0">
        <animate attributeName="r" values="19;30;30" keyTimes="0;0.18;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0" keyTimes="0;0.18;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <!-- Center Indicator -->
      <circle r="5" fill="#FFFFFF" filter="url(#softGlow)">
        <animate attributeName="r" values="8;10;5;5;5" keyTimes="0;0.08;0.22;0.9;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0.45;0.45;1" keyTimes="0;0.08;0.22;0.9;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <text y="42" class="w">IDEA</text>
    </g>

    <!-- Node 2: COMPONENTS (Beam arrives at t ~ 0.9s / keyTime 0.25) -->
    <g transform="translate(562 266)">
      <circle r="19" fill="#0D1117" stroke="#FFFFFF" stroke-opacity=".35"/>
      <!-- Flash Ripple -->
      <circle r="19" fill="none" stroke="#FFFFFF" opacity="0">
        <animate attributeName="r" values="19;19;30;30" keyTimes="0;0.24;0.42;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0;0" keyTimes="0;0.24;0.42;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <!-- Center Indicator -->
      <circle r="5" fill="#FFFFFF" filter="url(#softGlow)">
        <animate attributeName="r" values="5;5;10;5;5" keyTimes="0;0.22;0.30;0.44;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.45;1;0.45;0.45" keyTimes="0;0.22;0.30;0.44;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <text y="42" class="w">COMPONENTS</text>
    </g>

    <!-- Node 3: DATA (Beam arrives at t ~ 1.8s / keyTime 0.50) -->
    <g transform="translate(735 266)">
      <circle r="19" fill="#0D1117" stroke="#FFFFFF" stroke-opacity=".35"/>
      <!-- Flash Ripple -->
      <circle r="19" fill="none" stroke="#FFFFFF" opacity="0">
        <animate attributeName="r" values="19;19;30;30" keyTimes="0;0.49;0.67;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0;0" keyTimes="0;0.49;0.67;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <!-- Center Indicator -->
      <circle r="5" fill="#FFFFFF" filter="url(#softGlow)">
        <animate attributeName="r" values="5;5;10;5;5" keyTimes="0;0.47;0.55;0.69;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.45;1;0.45;0.45" keyTimes="0;0.47;0.55;0.69;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <text y="42" class="w">DATA</text>
    </g>

    <!-- Node 4: VERIFY (Beam arrives at t ~ 2.7s / keyTime 0.75) -->
    <g transform="translate(907 266)">
      <circle r="19" fill="#0D1117" stroke="#FFFFFF" stroke-opacity=".35"/>
      <!-- Flash Ripple -->
      <circle r="19" fill="none" stroke="#FFFFFF" opacity="0">
        <animate attributeName="r" values="19;19;30;30" keyTimes="0;0.74;0.92;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0;0" keyTimes="0;0.74;0.92;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <!-- Center Indicator -->
      <circle r="5" fill="#FFFFFF" filter="url(#softGlow)">
        <animate attributeName="r" values="5;5;10;5;5" keyTimes="0;0.72;0.80;0.94;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.45;1;0.45;0.45" keyTimes="0;0.72;0.80;0.94;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <text y="42" class="w">VERIFY</text>
    </g>

    <!-- Node 5: SHIP (Final Destination: Continuous White Beacon Pulse) -->
    <g transform="translate(1080 266)">
      <!-- Beacon Ripple Rings -->
      <circle r="20" fill="none" stroke="#FFFFFF" opacity="0.8">
        <animate attributeName="r" values="20;38" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="20" fill="none" stroke="#FFFFFF" opacity="0.4">
        <animate attributeName="r" values="20;38" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <!-- Main Solid Glowing Button -->
      <circle r="19" fill="#FFFFFF" filter="url(#glow)"/>
      <circle r="6" fill="#08090C"/>
      <text y="42" class="w">SHIP</text>
    </g>
  </g>

  <!-- The Traveling Light Beam (Pure White Photon) -->
  <g>
    <!-- Trail Glow -->
    <circle r="9" fill="#FFFFFF" opacity="0.35" filter="url(#glow)">
      <animateMotion path="M390 266H1080" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <!-- Core Photon -->
    <circle r="4.5" fill="#FFFFFF" filter="url(#glow)">
      <animateMotion path="M390 266H1080" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
