<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Bryan's developer terminal and telemetry</title>
  <desc id="desc">Developer dashboard showing full-stack bio with creative frontend focus, skill telemetry, and cybernetic orbital HUD architecture.</desc>
  <defs>
    <!-- White & Cyan Neon Glow Filters (Solid colors, No Gradients) -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Fira Code", monospace; }
      .spin-slow { animation: spin 28s linear infinite; transform-origin: 0 0; }
      .spin-reverse { animation: spin-rev 18s linear infinite; transform-origin: 0 0; }
      .radar-sweep { animation: spin 8s linear infinite; transform-origin: 0 0; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-rev { to { transform: rotate(-360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .spin-slow, .spin-reverse, .radar-sweep { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Outer Dark Canvas -->
  <rect width="1200" height="390" rx="20" fill="#0A0B10" stroke="#FFFFFF" stroke-opacity="0.14"/>

  <!-- ================= CARD 1: TERMINAL (Left) ================= -->
  <g transform="translate(24 20)">
    <rect width="500" height="350" rx="14" fill="#111218" stroke="#FFFFFF" stroke-opacity="0.12"/>
    
    <!-- Window Header -->
    <path d="M0 44H500" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="24" cy="22" r="5" fill="#FF5F57"/>
    <circle cx="42" cy="22" r="5" fill="#FEBC2E"/>
    <circle cx="60" cy="22" r="5" fill="#28C840"/>
    <text x="478" y="26" text-anchor="end" fill="#8B949E" font-size="11">bryan@dev:~/portfolio</text>

    <!-- Command 1: whoami -->
    <text x="24" y="74" fill="#FFFFFF" font-size="13" font-weight="700">&gt; whoami</text>
    <text x="24" y="93" fill="#E2E8F0" font-size="12">bryan · full-stack dev with creative frontend focus</text>

    <!-- Command 2: cat /about.txt (Fullstack breadth + Creative frontend passion) -->
    <text x="24" y="126" fill="#FFFFFF" font-size="13" font-weight="700">&gt; cat /about.txt</text>
    <text x="24" y="146" fill="#94A3B8" font-size="11.5">Full-stack builder with a deep creative spark for UI.</text>
    <text x="24" y="163" fill="#94A3B8" font-size="11.5">Obsessed with fluid motion, design craft &amp; micro-interactions.</text>
    <text x="24" y="180" fill="#94A3B8" font-size="11.5">Connecting solid backends (Supabase, C#) to great UX.</text>
    <text x="24" y="197" fill="#94A3B8" font-size="11.5">Security-conscious developer learning with Kali Linux.</text>

    <!-- Command 3: skills -->
    <text x="24" y="228" fill="#FFFFFF" font-size="13" font-weight="700">&gt; skills</text>
    <text x="24" y="247" fill="#E2E8F0" font-size="12">React · TypeScript · Next.js · Playwright · Expo</text>
    <text x="24" y="264" fill="#8B949E" font-size="12">Supabase · ASP.NET Core · PostgreSQL · Kali Linux</text>

    <!-- Divider and Live Prompt -->
    <path d="M24 286H476" stroke="#FFFFFF" stroke-opacity="0.08"/>
    
    <!-- Distinct Terminal Badge (Electric Cyan >_) -->
    <g transform="translate(24 308)">
      <rect width="28" height="19" rx="4" fill="#0C1B26" stroke="#00F0FF" stroke-opacity="0.6" stroke-width="1.2"/>
      <text x="14" y="14" text-anchor="middle" fill="#00F0FF" font-size="11" font-weight="800" filter="url(#glow)">&gt;_</text>
    </g>
    <text x="60" y="322" fill="#FFFFFF" font-size="12" font-weight="600">Ready for the next build...</text>
    <rect x="270" y="310" width="8" height="15" fill="#00F0FF">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ================= CARD 2: CORE SKILLS (Middle) ================= -->
  <g transform="translate(540 20)">
    <rect width="330" height="350" rx="14" fill="#111218" stroke="#FFFFFF" stroke-opacity="0.12"/>
    
    <!-- Header -->
    <text x="22" y="28" fill="#FFFFFF" font-size="11.5" font-weight="700" letter-spacing="1.4">CORE SKILLS</text>
    <path d="M0 44H330" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- Skill 1: Creative Frontend & Motion (95%) -->
    <rect x="22" y="60" width="28" height="28" rx="6" fill="#181A24" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="36" y="78" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">&lt;/&gt;</text>
    <text x="58" y="71" fill="#FFFFFF" font-size="12" font-weight="600">Frontend &amp; Creative UI</text>
    <text x="308" y="71" text-anchor="end" fill="#FFFFFF" font-size="12" font-weight="700">95%</text>
    <rect x="58" y="79" width="250" height="6" rx="3" fill="#1E202B"/>
    <rect x="58" y="79" width="237" height="6" rx="3" fill="#FFFFFF" filter="url(#softglow)"/>

    <!-- Skill 2: Testing & Visual QA (90%) -->
    <rect x="22" y="108" width="28" height="28" rx="6" fill="#181A24" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <path d="M30 122l4 4 8-8" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="58" y="119" fill="#FFFFFF" font-size="12" font-weight="600">Testing &amp; Visual QA</text>
    <text x="308" y="119" text-anchor="end" fill="#FFFFFF" font-size="12" font-weight="700">90%</text>
    <rect x="58" y="127" width="250" height="6" rx="3" fill="#1E202B"/>
    <rect x="58" y="127" width="225" height="6" rx="3" fill="#FFFFFF" filter="url(#softglow)"/>

    <!-- Skill 3: Fullstack & APIs (85%) -->
    <rect x="22" y="156" width="28" height="28" rx="6" fill="#181A24" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <path d="M36 163l6 3v7l-6 3-6-3v-7z M36 163v7 M30 166l6 4 6-4" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <text x="58" y="167" fill="#FFFFFF" font-size="12" font-weight="600">Fullstack &amp; Backend APIs</text>
    <text x="308" y="167" text-anchor="end" fill="#FFFFFF" font-size="12" font-weight="700">85%</text>
    <rect x="58" y="175" width="250" height="6" rx="3" fill="#1E202B"/>
    <rect x="58" y="175" width="212" height="6" rx="3" fill="#FFFFFF" filter="url(#softglow)"/>

    <!-- Skill 4: Security & Kali Linux (80%) -->
    <rect x="22" y="204" width="28" height="28" rx="6" fill="#181A24" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <path d="M36 211l6 2v4c0 4-3 7-6 8-3-1-6-4-6-8v-4z" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <text x="58" y="215" fill="#FFFFFF" font-size="12" font-weight="600">Security &amp; Kali Linux</text>
    <text x="308" y="215" text-anchor="end" fill="#FFFFFF" font-size="12" font-weight="700">80%</text>
    <rect x="58" y="223" width="250" height="6" rx="3" fill="#1E202B"/>
    <rect x="58" y="223" width="200" height="6" rx="3" fill="#FFFFFF" filter="url(#softglow)"/>

    <!-- Divider & Metrics -->
    <path d="M22 256H308" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <g transform="translate(22 278)">
      <!-- Metric 1 -->
      <g transform="translate(8 0)">
        <text x="0" y="16" fill="#FFFFFF" font-size="16" font-weight="800">8+</text>
        <text x="0" y="32" fill="#8B949E" font-size="10.5">Projects</text>
      </g>
      <!-- Separator -->
      <path d="M82 8V36" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <!-- Metric 2 -->
      <g transform="translate(100 0)">
        <text x="0" y="16" fill="#FFFFFF" font-size="16" font-weight="800">200+</text>
        <text x="0" y="32" fill="#8B949E" font-size="10.5">Commits</text>
      </g>
      <!-- Separator -->
      <path d="M184 8V36" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <!-- Metric 3 -->
      <g transform="translate(202 0)">
        <text x="0" y="16" fill="#FFFFFF" font-size="16" font-weight="800">UTC-6</text>
        <text x="0" y="32" fill="#8B949E" font-size="10.5">El Salvador</text>
      </g>
    </g>
  </g>

  <!-- ================= CARD 3: CORE ARCHITECTURE (Right) ================= -->
  <g transform="translate(886 20)">
    <rect width="290" height="350" rx="14" fill="#111218" stroke="#FFFFFF" stroke-opacity="0.12"/>
    
    <!-- Clean Professional Header -->
    <text x="22" y="28" fill="#FFFFFF" font-size="11.5" font-weight="700" letter-spacing="1.4">CORE ARCHITECTURE</text>
    <path d="M0 44H290" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- Orbital Scope Visualizer (Centered at 145, 168) -->
    <g transform="translate(145 168)">
      <!-- 4 Corner HUD Framing Brackets -->
      <path d="M-92 -76 H-80 M-92 -76 V-64 M92 -76 H80 M92 -76 V-64 M-92 76 H-80 M-92 76 V64 M92 76 H80 M92 76 V64" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.2" fill="none"/>

      <!-- Outer Calibration Circle -->
      <circle r="84" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
      
      <!-- Rotating Segmented Precision Reticle (Slow Majestic Spin) -->
      <circle r="76" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-dasharray="6 14 26 14" class="spin-slow"/>
      
      <!-- Counter-rotating Inner Tech Ring -->
      <circle r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-dasharray="32 16 8 16" class="spin-reverse"/>

      <!-- Expanding Radar Sonar Waves -->
      <circle r="10" fill="none" stroke="#FFFFFF">
        <animate attributeName="r" values="10;72;84" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.75;0.15;0" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="1.6;0.8;0.2" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="none" stroke="#FFFFFF">
        <animate attributeName="r" values="10;72;84" dur="4s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.75;0.15;0" dur="4s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="1.6;0.8;0.2" dur="4s" begin="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Smooth 360-degree Sweeping Radar Beam (Slow 8s cycle) -->
      <line x1="0" y1="0" x2="0" y2="-76" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glow)" class="radar-sweep"/>

      <!-- Precision Crosshairs with Tick Marks -->
      <path d="M-80 0H80 M0 -80V80" stroke="#FFFFFF" stroke-opacity="0.14" stroke-dasharray="2 4"/>
      <path d="M-80 -3V3 M80 -3V3 M-3 -80H3 M-3 80H3" stroke="#FFFFFF" stroke-opacity="0.45"/>

      <!-- ================= STAGGERED DATA PACKET STREAM (Slow, Sequential, Staggered) ================= -->
      <!-- Dot 1: Emits from UI CRAFT (North) between 0.0s and 1.5s -->
      <circle r="2.8" fill="#FFFFFF" filter="url(#glow)">
        <animate attributeName="cy" values="-64; 0; 0; -64" keyTimes="0; 0.25; 0.99; 1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 1; 0; 0" keyTimes="0; 0.04; 0.25; 1" dur="6s" repeatCount="indefinite"/>
      </circle>

      <!-- Dot 2: Emits from VISUAL QA (East) between 1.5s and 3.0s -->
      <circle r="2.8" fill="#FFFFFF" filter="url(#glow)">
        <animate attributeName="cx" values="64; 64; 0; 0; 64" keyTimes="0; 0.25; 0.50; 0.99; 1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.25; 0.29; 0.50; 1" dur="6s" repeatCount="indefinite"/>
      </circle>

      <!-- Dot 3: Emits from FULLSTACK (South) between 3.0s and 4.5s -->
      <circle r="2.8" fill="#FFFFFF" filter="url(#glow)">
        <animate attributeName="cy" values="64; 64; 0; 0; 64" keyTimes="0; 0.50; 0.75; 0.99; 1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.50; 0.54; 0.75; 1" dur="6s" repeatCount="indefinite"/>
      </circle>

      <!-- Dot 4: Emits from SECURITY (West) between 4.5s and 6.0s -->
      <circle r="2.8" fill="#FFFFFF" filter="url(#glow)">
        <animate attributeName="cx" values="-64; -64; 0; 0; -64" keyTimes="0; 0.75; 1; 1; 1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.75; 0.79; 1; 1" dur="6s" repeatCount="indefinite"/>
      </circle>

      <!-- 4 Cardinal Circular Telemetry Pods (Responsive sequential pulse) -->
      <!-- Top: UI CRAFT -->
      <circle cy="-64" r="4.5" fill="#FFFFFF" filter="url(#glow)">
        <animate attributeName="r" values="4.5; 6; 4.5; 4.5" keyTimes="0; 0.08; 0.25; 1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text y="-74" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700" letter-spacing="0.8">UI CRAFT</text>

      <!-- Right: VISUAL QA -->
      <circle cx="64" r="4.5" fill="#FFFFFF" filter="url(#glow)">
        <animate attributeName="r" values="4.5; 4.5; 6; 4.5; 4.5" keyTimes="0; 0.25; 0.33; 0.50; 1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text x="74" y="3.5" fill="#FFFFFF" font-size="9" font-weight="700" letter-spacing="0.8">VISUAL QA</text>

      <!-- Bottom: FULLSTACK -->
      <circle cy="64" r="4.5" fill="#FFFFFF" filter="url(#glow)">
        <animate attributeName="r" values="4.5; 4.5; 6; 4.5; 4.5" keyTimes="0; 0.50; 0.58; 0.75; 1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text y="80" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700" letter-spacing="0.8">FULLSTACK</text>

      <!-- Left: SECURITY -->
      <circle cx="-64" r="4.5" fill="#FFFFFF" filter="url(#glow)">
        <animate attributeName="r" values="4.5; 4.5; 6; 4.5; 4.5" keyTimes="0; 0.75; 0.83; 1; 1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text x="-74" y="3.5" text-anchor="end" fill="#FFFFFF" font-size="9" font-weight="700" letter-spacing="0.8">SECURITY</text>

      <!-- Center Orbital Reactor Core (Pulses gently with every incoming packet) -->
      <circle r="18" fill="#0A0B10" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.85" filter="url(#softglow)"/>
      <circle r="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-dasharray="3 3" class="spin-slow"/>
      <circle r="4" fill="#FFFFFF" filter="url(#glow)">
        <animate attributeName="r" values="3.8; 5.2; 3.8; 5.2; 3.8; 5.2; 3.8; 5.2; 3.8" keyTimes="0; 0.25; 0.28; 0.50; 0.53; 0.75; 0.78; 1; 1" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Footer: Personal developer motto -->
    <path d="M22 290H268" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="145" y="318" text-anchor="middle" fill="#94A3B8" font-size="9.5" font-weight="600" letter-spacing="1">code with craft · ship with care</text>
  </g>
</svg>
