 font-weight="800">ANTIGRAVITY</text><text x="16" y="108" class="m" font-size="10">GOOGLE</text><path d="M16 122H192" stroke="#FFF" stroke-opacity=".08"/><text x="16" y="146" fill="#8B5CF6" font-size="10">agents · orchestration</text></g></g><g transform="translate(719 104)"><g class="card" style="animation-delay:1.35s"><rect width="208" height="164" rx="18" fill="#13131A" fill-opacity=".82" stroke="#FFF" stroke-opacity=".11"/><rect x="16" y="16" width="42" height="42" rx="12" fill="#4285F4" fill-opacity=".12" stroke="#4285F4" stroke-opacity=".7"/><circle cx="37" cy="37" r="7" fill="#4285F4" filter="url(#glow)"><animate attributeName="r" values="5;8;5" dur="3.35s" repeatCount="indefinite"/></circle><text x="16" y="84" class="w" font-size="15" font-weight="800">GEMINI</text><text x="16" y="108" class="m" font-size="10">GOOGLE</text><path d="M16 122H192" stroke="#FFF" stroke-opacity=".08"/><text x="16" y="146" fill="#4285F4" font-size="10">research · multimodal</text></g></g><g transform="translate(946 104)"><g class="card" style="animation-delay:1.8s"><rect width="208" height="164" rx="18" fill="#13131A" fill-opacity=".82" stroke="#FFF" stroke-opacity=".11"/><rect x="16" y="16" width="42" height="42" rx="12" fill="#FFFFFF" fill-opacity=".12" stroke="#FFFFFF" stroke-opacity=".7"/><circle cx="37" cy="37" r="7" fill="#FFFFFF" filter="url(#glow)"><animate attributeName="r" values="5;8;5" dur="3.60s" repeatCount="indefinite"/></circle><text x="16" y="84" class="w" font-size="15" font-weight="800">COPILOT</text><text x="16" y="108" class="m" font-size="10">GITHUB</text><path d="M16 122H192" stroke="#FFF" stroke-opacity=".08"/><text x="16" y="146" fill="#FFFFFF" font-size="10">pair · accelerate</text></g></g>
