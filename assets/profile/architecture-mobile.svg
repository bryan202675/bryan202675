<svg xmlns="http://www.w3.org/2000/svg" width="400" height="420" viewBox="0 0 400 420" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura conceptual móvil</title><desc id="desc">Cuatro capas de arquitectura ilustrativa en una columna.</desc>
<defs><linearGradient id="ice" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DDF8FF"/><stop offset="1" stop-color="#9EE7FF"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
.title{fill:#F8FDFF;font-size:17px;font-weight:700;letter-spacing:1.5px}
.label{fill:#F8FDFF;font-size:15px;font-weight:700}
.muted{fill:#AEBBC7;font-size:12px}
.ice{fill:#BDEFFF}
.pulse{animation:pulse 4.6s ease-in-out infinite}
.trace{animation:trace 9s linear infinite}
.reveal{animation:reveal 9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.48}50%{opacity:1}}
@keyframes trace{to{stroke-dashoffset:-72}}
@keyframes reveal{0%,5%{opacity:.32}16%,86%{opacity:1}100%{opacity:.32}}
@media(prefers-reduced-motion:reduce){.pulse,.trace,.reveal{animation:none!important;opacity:1!important}.traveler{display:none}}
</style></defs>
<rect width="400" height="420" rx="20" fill="#0A0A0F"/><rect x="1" y="1" width="398" height="418" rx="19" fill="none" stroke="#DDF8FF" stroke-opacity=".18"/>
<text x="19" y="32" class="muted">SYSTEM ARCHITECTURE / CONCEPT</text>
<path d="M50 91V349" fill="none" stroke="#BDEFFF" stroke-opacity=".45" stroke-width="2" stroke-dasharray="5 8" class="trace"/><g transform="translate(25 57)" class="reveal" style="animation-delay:0.0s"><rect width="350" height="69" rx="12" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="25" cy="34" r="6" fill="none" stroke="#BDEFFF" stroke-width="2" class="pulse"/><text x="48" y="31" class="label">CLIENT</text><text x="48" y="50" class="muted">WEB / MOBILE</text></g><g transform="translate(25 143)" class="reveal" style="animation-delay:0.6s"><rect width="350" height="69" rx="12" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="25" cy="34" r="6" fill="none" stroke="#BDEFFF" stroke-width="2" class="pulse"/><text x="48" y="31" class="label">API</text><text x="48" y="50" class="muted">REQUESTS</text></g><g transform="translate(25 229)" class="reveal" style="animation-delay:1.2s"><rect width="350" height="69" rx="12" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="25" cy="34" r="6" fill="none" stroke="#BDEFFF" stroke-width="2" class="pulse"/><text x="48" y="31" class="label">SERVICES</text><text x="48" y="50" class="muted">APPLICATION</text></g><g transform="translate(25 315)" class="reveal" style="animation-delay:1.7999999999999998s"><rect width="350" height="69" rx="12" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="25" cy="34" r="6" fill="none" stroke="#BDEFFF" stroke-width="2" class="pulse"/><text x="48" y="31" class="label">DATABASE</text><text x="48" y="50" class="muted">PERSISTENCE</text></g>
</svg>
