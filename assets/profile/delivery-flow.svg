<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
<title id="title">Del concepto a producción</title><desc id="desc">Flujo conceptual de idea, diseño, desarrollo, pruebas, despliegue y monitoreo.</desc>
<defs><linearGradient id="ice" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DDF8FF"/><stop offset="1" stop-color="#9EE7FF"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
.title{fill:#F8FDFF;font-size:17px;font-weight:700;letter-spacing:1.5px}
.label{fill:#F8FDFF;font-size:15px;font-weight:700}
.muted{fill:#AEBBC7;font-size:12px}
.ice{fill:#BDEFFF}
.pulse{animation:pulse 4.6s ease-in-out infinite}
.trace{animation:trace 9s linear infinite}
.reveal{animation:reveal 9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.48}50%{opacity:1}}
@keyframes trace{to{stroke-dashoffset:-72}}
@keyframes reveal{0%,5%{opacity:.32}16%,86%{opacity:1}100%{opacity:.32}}
@media(prefers-reduced-motion:reduce){.pulse,.trace,.reveal{animation:none!important;opacity:1!important}.traveler{display:none}}
</style></defs>
<rect width="800" height="260" rx="20" fill="#0A0A0F"/><rect x="1" y="1" width="798" height="258" rx="19" fill="none" stroke="#DDF8FF" stroke-opacity=".18"/>
<text x="23" y="35" class="title">FROM IDEA TO PRODUCTION</text><path d="M246 104H300M500 104H554M654 144V164M554 204H500M300 204H246" fill="none" stroke="#BDEFFF" stroke-opacity=".48" stroke-width="2" stroke-dasharray="5 8" class="trace"/>
<circle r="4" fill="#F8FDFF" class="traveler" filter="url(#glow)"><animateMotion path="M146 104H654V204H146" dur="16s" repeatCount="indefinite"/></circle><g transform="translate(46 64)"><rect width="200" height="80" rx="14" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="27" cy="27" r="5" fill="#BDEFFF" class="pulse"/><text x="45" y="31" class="muted">01</text><text x="27" y="57" class="label">IDEA</text></g><g transform="translate(300 64)"><rect width="200" height="80" rx="14" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="27" cy="27" r="5" fill="#BDEFFF" class="pulse"/><text x="45" y="31" class="muted">02</text><text x="27" y="57" class="label">DESIGN</text></g><g transform="translate(554 64)"><rect width="200" height="80" rx="14" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="27" cy="27" r="5" fill="#BDEFFF" class="pulse"/><text x="45" y="31" class="muted">03</text><text x="27" y="57" class="label">DEVELOPMENT</text></g><g transform="translate(46 164)"><rect width="200" height="80" rx="14" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="27" cy="27" r="5" fill="#BDEFFF" class="pulse"/><text x="45" y="31" class="muted">06</text><text x="27" y="57" class="label">MONITORING</text></g><g transform="translate(300 164)"><rect width="200" height="80" rx="14" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="27" cy="27" r="5" fill="#BDEFFF" class="pulse"/><text x="45" y="31" class="muted">05</text><text x="27" y="57" class="label">DEPLOYMENT</text></g><g transform="translate(554 164)"><rect width="200" height="80" rx="14" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="27" cy="27" r="5" fill="#BDEFFF" class="pulse"/><text x="45" y="31" class="muted">04</text><text x="27" y="57" class="label">TESTING</text></g>
</svg>
