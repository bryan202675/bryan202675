dex · Python · Bash</text></g><g transform="translate(412 288)" class="reveal" style="animation-delay:2.5s"><rect width="366" height="92" rx="14" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".15"/><circle cx="23" cy="31" r="5" fill="#BDEFFF" class="pulse" style="animation-delay:2.0s"/><text x="41" y="36" class="label">INFRA + SECURITY</text><text x="22" y="68" class="muted">Git · GitHub · Vercel · Kali Linux</text></g>
