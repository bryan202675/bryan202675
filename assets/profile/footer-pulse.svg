<svg xmlns="http://www.w3.org/2000/svg" width="800" height="82" viewBox="0 0 800 82" role="img" aria-labelledby="title desc">
<title id="title">Cierre del perfil</title><desc id="desc">Línea de terminal con pulso sutil y lema construir, verificar y mejorar.</desc>
<defs><linearGradient id="ice" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DDF8FF"/><stop offset="1" stop-color="#9EE7FF"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
.title{fill:#F8FDFF;font-size:17px;font-weight:700;letter-spacing:1.5px}
.label{fill:#F8FDFF;font-size:15px;font-weight:700}
.muted{fill:#AEBBC7;font-size:12px}
.ice{fill:#BDEFFF}
.pulse{animation:pulse 4.6s ease-in-out infinite}
.trace{animation:trace 9s linear infinite}
.reveal{animation:reveal 9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.48}50%{opacity:1}}
@keyframes trace{to{stroke-dashoffset:-72}}
@keyframes reveal{0%,5%{opacity:.32}16%,86%{opacity:1}100%{opacity:.32}}
@media(prefers-reduced-motion:reduce){.pulse,.trace,.reveal{animation:none!important;opacity:1!important}.traveler{display:none}}
</style></defs>
<rect width="800" height="82" rx="20" fill="#0A0A0F"/><rect x="1" y="1" width="798" height="80" rx="19" fill="none" stroke="#DDF8FF" stroke-opacity=".18"/>
<path d="M25 35H775" stroke="#DDF8FF" stroke-opacity=".15"/><path d="M25 35H150" stroke="url(#ice)" stroke-width="2" stroke-dasharray="8 14" class="trace"/>
<circle cx="25" cy="35" r="4" fill="#BDEFFF" class="pulse"/><text x="400" y="66" text-anchor="middle" class="muted">BUILD · VERIFY · IMPROVE</text>
</svg>
