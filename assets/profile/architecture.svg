<svg xmlns="http://www.w3.org/2000/svg" width="800" height="254" viewBox="0 0 800 254" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura conceptual</title><desc id="desc">Flujo ilustrativo desde clientes web y móvil hasta API, servicios y base de datos; no representa un proyecto específico.</desc>
<defs><linearGradient id="ice" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DDF8FF"/><stop offset="1" stop-color="#9EE7FF"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
.title{fill:#F8FDFF;font-size:17px;font-weight:700;letter-spacing:1.5px}
.label{fill:#F8FDFF;font-size:15px;font-weight:700}
.muted{fill:#AEBBC7;font-size:12px}
.ice{fill:#BDEFFF}
.pulse{animation:pulse 4.6s ease-in-out infinite}
.trace{animation:trace 9s linear infinite}
.reveal{animation:reveal 9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.48}50%{opacity:1}}
@keyframes trace{to{stroke-dashoffset:-72}}
@keyframes reveal{0%,5%{opacity:.32}16%,86%{opacity:1}100%{opacity:.32}}
@media(prefers-reduced-motion:reduce){.pulse,.trace,.reveal{animation:none!important;opacity:1!important}.traveler{display:none}}
</style></defs>
<rect width="800" height="254" rx="20" fill="#0A0A0F"/><rect x="1" y="1" width="798" height="252" rx="19" fill="none" stroke="#DDF8FF" stroke-opacity=".18"/>
<text x="23" y="36" class="title">SYSTEM ARCHITECTURE / CONCEPTUAL VIEW</text>
<path d="M194 143H217M389 143H412M584 143H607" stroke="#BDEFFF" stroke-opacity=".6" stroke-width="2" stroke-dasharray="5 7" class="trace"/><g transform="translate(22 91)" class="reveal" style="animation-delay:0.0s"><rect width="172" height="104" rx="15" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="26" cy="29" r="7" fill="none" stroke="#BDEFFF" stroke-width="2" class="pulse" style="animation-delay:0.0s"/><text x="24" y="64" class="label">CLIENT</text><text x="24" y="84" class="muted">WEB / MOBILE</text></g><g transform="translate(217 91)" class="reveal" style="animation-delay:0.6s"><rect width="172" height="104" rx="15" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="26" cy="29" r="7" fill="none" stroke="#BDEFFF" stroke-width="2" class="pulse" style="animation-delay:0.5s"/><text x="24" y="64" class="label">API</text><text x="24" y="84" class="muted">REQUESTS</text></g><g transform="translate(412 91)" class="reveal" style="animation-delay:1.2s"><rect width="172" height="104" rx="15" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="26" cy="29" r="7" fill="none" stroke="#BDEFFF" stroke-width="2" class="pulse" style="animation-delay:1.0s"/><text x="24" y="64" class="label">SERVICES</text><text x="24" y="84" class="muted">APPLICATION</text></g><g transform="translate(607 91)" class="reveal" style="animation-delay:1.7999999999999998s"><rect width="172" height="104" rx="15" fill="#13151D" stroke="#E8FAFF" stroke-opacity=".18"/><circle cx="26" cy="29" r="7" fill="none" stroke="#BDEFFF" stroke-width="2" class="pulse" style="animation-delay:1.5s"/><text x="24" y="64" class="label">DATABASE</text><text x="24" y="84" class="muted">PERSISTENCE</text></g><circle r="4" fill="#F8FDFF" class="traveler" filter="url(#glow)"><animateMotion path="M194 143H607" dur="9s" repeatCount="indefinite"/></circle>
<text x="24" y="235" class="muted">Diagramas de referencia; cada proyecto tiene sus propias decisiones de arquitectura.</text>
</svg>
